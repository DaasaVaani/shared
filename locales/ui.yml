  lyricOnlineLimits: "ಕನ್ನಡ ಪಠ್ಯವನ್ನು ಓದಲು ಮಾತ್ರ. ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ಪಟ್ಟಿಯ ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತದೆ; ಸಾಹಿತ್ಯವನ್ನು ತೆರೆದಾಗ ಆ ಸಾಹಿತ್ಯ ಮಾತ್ರ ಡೌನ್‌ಲೋಡ್ ಆಗುತ್ತದೆ. ಪರಿಶೀಲಿಸಿದ ಪಠ್ಯವು ಮೆಮೊರಿಯಲ್ಲಿ ಮಾತ್ರ ಉಳಿಯುತ್ತದೆ, ಶಾಶ್ವತ ಆಫ್‌ಲೈನ್ ಸಂಗ್ರಹವಲ್ಲ. ವೈಯಕ್ತಿಕ ಮಾಹಿತಿ ಈ ಸಾಧನದಲ್ಲೇ ಉಳಿಯುತ್ತದೆ; ಸಂಪೂರ್ಣ ಭಾಷಾಧಾರಿತ ಹುಡುಕಾಟ ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ."
